name: Build TradeMindMZ Android APK

# Trigges ved push til main/master, pull requests, og manuelt (workflow_dispatch)
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build Capacitor Android debug APK
    permissions:
      contents: read
      actions: write

    steps:
      # 1. Sjekk ut prosjektet
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Sett opp Java 21 (kreves av nåværende Capacitor Android-modul)
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Sett opp Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 4. Sett opp pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      # 5. Installer prosjektets dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 6. Bygg React/Vite webappen
      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm exec vite build

      # Verify Supabase build environment without exposing secret values
      - name: Verify Supabase build environment
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY2'
          import os
          import re

          url = os.environ.get("VITE_SUPABASE_URL", "")
          key = os.environ.get("VITE_SUPABASE_ANON_KEY", "")

          print("=== SUPABASE ENV SAFE CHECK ===")
          print("URL present:", bool(url))
          print("URL length:", len(url))
          print("URL starts https:", url.startswith("https://"))
          print("URL whitespace:", bool(re.search(r"\s", url)))
          print("KEY present:", bool(key))
          print("KEY length:", len(key))
          print("KEY whitespace:", bool(re.search(r"\s", key)))
          print("KEY quotes:", '"' in key or "'" in key)
          print("KEY ASCII:", all(ord(c) < 128 for c in key))
          print("KEY JWT parts:", len(key.split(".")))
          print("KEY JWT-like:", len(key.split(".")) == 3)

          if not url or not key:
              raise SystemExit("ERROR: Supabase secret missing")

          if not url.startswith("https://"):
              raise SystemExit("ERROR: Supabase URL format invalid")

          if re.search(r"\s", url) or re.search(r"\s", key):
              raise SystemExit("ERROR: Supabase secret contains whitespace")

          if len(key.split(".")) != 3:
              raise SystemExit("ERROR: Supabase key is not JWT-like")

          print("RESULT: SUPABASE BUILD ENVIRONMENT OK")
          PY2

      # 7. Kopier web assets inn i Capacitor Android
      - name: Copy web assets to Android
        run: pnpm exec cap copy android

      # 8. Sett opp Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Kun cmdline-tools; SDK-komponentene installeres eksplisitt under.
          cmdline-tools-version: '11076708'

      # 9. Installer nødvendige SDK-komponenter
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-33" "build-tools;33.0.0" "platform-tools"

      # 10. Gjør gradlew kjørbar
      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      # 11. Bygg debug APK
      - name: Build debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      # 12. Last opp app-debug.apk som artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trademindmz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
