name: Build TradeMindMZ Android APK

# Trigges ved push til main/master, pull requests, og manuelt (workflow_dispatch)
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build Capacitor Android debug APK
    permissions:
      contents: read
      actions: write

    steps:
      # 1. Sjekk ut prosjektet
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Sett opp Java 17 (kreves av Android Gradle Plugin 8.0)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Sett opp Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Kun cmdline-tools; SDK-komponentene installeres eksplisitt under.
          cmdline-tools-version: '11076708'

      # 4. Installer nødvendige SDK-komponenter
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-33" "build-tools;33.0.0" "platform-tools"

      # 5. Gjør gradlew kjørbar
      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      # 6. Bygg debug APK
      - name: Build debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      # 7. Last opp app-debug.apk som artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trademindmz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
